<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hoop Dynasty GM v2</title>
<style>
/* ===== STYLES ===== */
:root{--bg:#0a0f1f;--p:#151c36;--p2:#1e2750;--tx:#eef1ff;--mu:#8d97c2;--ac:#ff7a1a;--c0:#9aa3b5;--c1:#3b9cff;--c2:#b45cff;--c3:#ffc933}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle at 20% -10%,#1d2a6b,var(--bg) 55%) fixed;color:var(--tx);font:15px/1.4 system-ui,Segoe UI,sans-serif;min-height:100vh;padding:64px 0 80px}
#top{position:fixed;top:0;left:0;right:0;height:54px;background:#0c1228ee;backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:20;border-bottom:1px solid #26305c}
.logo{font-weight:900;letter-spacing:1px;color:var(--ac)}
.cur{display:flex;gap:12px;font-weight:700;align-items:center}
.cur button{background:none;border:0;font-size:18px;cursor:pointer}
#nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#0c1228f5;border-top:1px solid #26305c;z-index:20}
#nav button{flex:1;padding:8px 0 10px;background:none;border:0;color:var(--mu);font:inherit;font-size:12px;cursor:pointer}
#nav button b{display:block;font-size:20px}
#nav button.on{color:var(--ac)}
main{max-width:1000px;margin:0 auto;padding:14px}
h2{margin:4px 0 12px}h3{margin-bottom:8px}
.panel{background:var(--p);border:1px solid #26305c;border-radius:16px;padding:14px;margin-bottom:14px}
.btn{background:linear-gradient(135deg,var(--ac),#ff4d4d);border:0;color:#fff;font:inherit;font-weight:700;padding:10px 16px;border-radius:12px;cursor:pointer;transition:.15s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.btn.s{background:var(--p2)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;justify-items:center}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.big{font-size:54px;font-weight:900;color:var(--ac);line-height:1}.big small{display:block;font-size:11px;color:var(--mu)}
.syn{display:flex;justify-content:space-between;padding:4px 0;color:var(--mu)}.syn.on{color:#7dff9a}
select{background:var(--p2);color:var(--tx);border:1px solid #333f78;border-radius:8px;padding:7px}
/* cards */
.card{width:150px;height:216px;border-radius:14px;padding:8px;position:relative;background:linear-gradient(160deg,var(--cc),#10162e 75%);border:3px solid var(--cc);cursor:pointer;overflow:hidden;transition:.2s;text-align:center}
.card:hover{transform:translateY(-4px) scale(1.03)}
.r0{--cc:var(--c0)}.r1{--cc:var(--c1)}.r2{--cc:var(--c2)}.r3{--cc:var(--c3)}
.card.r2{box-shadow:0 0 12px #b45cff88}
.card.r3{box-shadow:0 0 20px var(--c3),inset 0 0 12px #ffc93355}
.card.r3::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#fff7 50%,transparent 65%);transform:translateX(-100%);animation:shine 2.4s infinite;pointer-events:none}
@keyframes shine{to{transform:translateX(100%)}}
.ov{position:absolute;top:6px;left:9px;font-size:26px;font-weight:900;line-height:1}
.ps{position:absolute;top:8px;right:9px;font-size:12px;font-weight:800;background:#0008;border-radius:6px;padding:1px 6px}
.card svg{width:76px;height:76px;margin-top:20px}
.nm{font-weight:800;font-size:13px;margin:2px 0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.st{display:grid;grid-template-columns:1fr 1fr;gap:1px 8px;font-size:10.5px;color:#cfd6f5;text-align:left;padding:0 6px}.st b{color:#fff;float:right}
.up{position:absolute;bottom:4px;right:6px;font-size:10px;color:#7dff9a;font-weight:800}
.tag{position:absolute;bottom:4px;left:6px;font-size:9px;background:var(--ac);border-radius:5px;padding:0 5px;font-weight:800}
.lock{filter:grayscale(1) brightness(.5)}.lock .q{font-size:60px;margin-top:40px;font-weight:900}
.dim{opacity:.55}
.empty{width:150px;height:216px;border:2px dashed #3a4890;border-radius:14px;display:grid;place-items:center;color:var(--mu);text-align:center;font-weight:700}
/* flip cards */
.fc{perspective:800px;width:150px;height:216px}
.fi{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.fc.on .fi{transform:rotateY(180deg)}
.fi>*{position:absolute;inset:0;backface-visibility:hidden}
.fi>.card{transform:rotateY(180deg)}.fi>.card:hover{transform:rotateY(180deg)}
.back{border-radius:14px;background:repeating-linear-gradient(45deg,#1b2552,#1b2552 10px,#243069 10px,#243069 20px);border:3px solid #3a4890;display:grid;place-items:center;font-size:44px}
.fcw{text-align:center}.res{opacity:0;transition:.4s;font-weight:800;font-size:12px;margin-top:6px;color:#7dff9a;min-height:18px}.fc.on+.res{opacity:1}
/* overlay */
#ov{position:fixed;inset:0;background:#050813ee;z-index:50;display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
#ov.show{display:flex}.flash{animation:flash .9s}
@keyframes flash{0%{background:#ffffffee}100%{background:#050813ee}}
.mbox{background:var(--p);border:1px solid #333f78;border-radius:18px;padding:18px;max-width:900px;width:100%;max-height:92vh;overflow:auto;text-align:center}
.shake{animation:shake .45s infinite;font-size:110px;display:inline-block}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-12deg) scale(1.06)}75%{transform:rotate(12deg) scale(1.06)}}
.cards{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:14px 0}
/* store */
.pack{display:flex;gap:14px;align-items:center;flex-wrap:wrap}.pack .ico{font-size:56px}.pack .info{flex:1;min-width:200px}
.odds{font-size:13px;color:var(--mu)}
/* game */
.board{display:flex;justify-content:space-around;align-items:center;text-align:center;gap:6px}
.board .tm{flex:1;font-weight:800}.board b{display:block;font-size:46px;color:var(--ac)}.board .mid{font-weight:800}
.feed{height:300px;overflow:auto;font-size:13.5px}.feed div{padding:4px 0;border-bottom:1px solid #222c58;animation:fin .3s}.feed .hl{color:var(--c3);font-weight:800}
@keyframes fin{from{opacity:0;transform:translateY(-6px)}}
.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:5px 8px;text-align:right}th:first-child,td:first-child{text-align:left}tr.star td{color:var(--c3);font-weight:700}
.sched div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid #222c58;color:var(--mu)}.sched .cur2{color:#fff;font-weight:700}.W{color:#7dff9a}.L{color:#ff6b6b}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:10px 18px;border-radius:12px;font-weight:700;z-index:80;display:none;max-width:90%;text-align:center}
@media(min-width:700px){.card,.fc,.empty{width:160px}}
/* v2 additions */
#nav button{font-size:10.5px}#nav button b{font-size:18px}
.sel{outline:3px solid var(--ac);transform:translateY(-4px)}
.trs{position:absolute;bottom:20px;left:0;right:0;font-size:13px;letter-spacing:2px;white-space:nowrap}.trmore{font:800 10px/1 system-ui;letter-spacing:0;background:#000a;border-radius:8px;padding:2px 4px;margin-left:2px;vertical-align:2px;color:#9ff}
.inj{position:absolute;top:34px;left:8px;font-size:11px;background:#d33;border-radius:6px;padding:0 5px;font-weight:800}
.up{color:#ffd54a!important;font-size:12px!important}
.det{display:flex;flex-wrap:wrap;gap:16px;justify-content:center}
.xp{height:10px;background:#0d1330;border-radius:6px;overflow:hidden;margin:6px 0}.xp i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),#ffc933)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0}.day{background:var(--p2);border-radius:10px;padding:6px 2px;text-align:center;font-size:11px}.day.on{background:#1c5a34}.day.nx{outline:2px solid var(--ac)}
.ach{display:inline-block;width:calc(50% - 8px);vertical-align:top;background:var(--p2);border-radius:10px;padding:8px;margin:3px;opacity:.5;font-size:13px}.ach.on{opacity:1}.ach small{display:block;color:var(--mu)}
.note{background:#3a2a0e;border:1px solid #7a5a1a;border-radius:10px;padding:8px 12px;margin-bottom:8px;font-weight:700}
.sticky{position:sticky;top:60px;z-index:5}
.ps{text-align:center;line-height:1.1}.ps small{display:block;font-size:8px;font-weight:600;opacity:.75}
:root{--c4:#ff3b4e}.r4{--cc:var(--c4)}

main.enter>*{animation:rise .38s ease both}main.enter>*:nth-child(2){animation-delay:.05s}main.enter>*:nth-child(3){animation-delay:.1s}main.enter>*:nth-child(4){animation-delay:.15s}

.feed .hot{color:#ffb347}.feed .stl{color:#7dd3ff}
.note{background:linear-gradient(90deg,#4a3410,#2a1d08);border-color:#ff7a1a88;box-shadow:0 0 14px #ff7a1a33}
/* cards */
.grid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:16px}
.card,.fc,.empty,.back{width:156px;height:232px}
.card{padding:0;border:3px solid transparent;border-radius:16px;display:flex;flex-direction:column;overflow:hidden;text-align:left;
 background:linear-gradient(#111836,#0b1128) padding-box,linear-gradient(145deg,var(--cc),#ffffff55 45%,var(--cc)) border-box;box-shadow:0 8px 20px #0008}
.card:hover{transform:translateY(-7px) scale(1.045);box-shadow:0 16px 30px #000b,0 0 26px var(--cc)}
.fi>.card:hover{transform:rotateY(180deg)}.fc .card{width:100%;height:100%}

/* ===== v10 · POLISH LAYER (visual only — no layout or logic changes) ===== */
:root{--bg:#070b1a;--p:#121a38;--p2:#1b2552;--ac:#ff7a1a;--ac2:#ff3d7f;--glow:#ff7a1a55;--ln:#ffffff1a;--ease:cubic-bezier(.2,.8,.2,1)}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(1100px 600px at 10% -10%,#27389a66,transparent 60%),radial-gradient(900px 500px at 100% 10%,#7a2cff40,transparent 60%),radial-gradient(800px 500px at 50% 120%,#ff7a1a22,transparent 60%),var(--bg) fixed;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;letter-spacing:.01em}
::selection{background:var(--ac);color:#fff}
*{scrollbar-width:thin;scrollbar-color:#3a4890 transparent}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:linear-gradient(#4a5cc0,#2a3470);border-radius:8px}::-webkit-scrollbar-track{background:transparent}
/* top bar + logo */
#top{background:linear-gradient(180deg,#0b1130f2,#0b1130cc);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border-bottom:1px solid transparent;border-image:linear-gradient(90deg,transparent,#ff7a1a99,#7a4cff99,transparent) 1;box-shadow:0 8px 30px #0008}
.logo{font-weight:900;font-size:15px;white-space:nowrap}.logo i{font-style:normal;letter-spacing:.12em;background:linear-gradient(90deg,#ffb347,#ff4d6d 55%,#b45cff);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 10px #ff7a1a55)}.lgi{filter:drop-shadow(0 0 8px #ff7a1a)}@media (max-width:440px){.logo i{letter-spacing:.04em;font-size:13px}.cur{gap:6px}}
.pill{background:linear-gradient(180deg,#ffffff14,#00000055);border:1px solid #ffffff2e;box-shadow:inset 0 1px 0 #ffffff26,0 2px 10px #0006;font-weight:800;transition:transform .15s var(--ease)}.pill:hover{transform:translateY(-1px)}
/* bottom nav */
#nav{background:linear-gradient(0deg,#0a0f2cfa,#0c1334ee);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid #ffffff14;box-shadow:0 -10px 30px #0009;padding-bottom:env(safe-area-inset-bottom)}
#nav button{position:relative;transition:color .2s,transform .2s var(--ease)}
#nav button b{transition:transform .25s var(--ease),filter .25s}
#nav button.on{color:#fff;text-shadow:0 0 12px var(--ac)}
#nav button.on b{transform:translateY(-3px) scale(1.18);filter:drop-shadow(0 0 8px var(--ac))}
#nav button.on::after{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 4px 4px;background:linear-gradient(90deg,var(--ac),var(--ac2));box-shadow:0 0 14px var(--ac)}
#nav button:active b{transform:scale(.9)}
/* headings */
h2{font-weight:900;letter-spacing:.01em;color:#fff;text-shadow:0 2px 18px #7a8cff55}
.phead h2{font-size:24px}.phead .sub{letter-spacing:.04em;text-transform:uppercase;font-size:11px;font-weight:700}
h3{font-weight:800;letter-spacing:.02em}
.panel h3{display:flex;align-items:center;gap:8px}.panel h3::before{content:"";width:4px;height:16px;border-radius:3px;background:linear-gradient(var(--ac),var(--ac2));box-shadow:0 0 10px var(--glow);flex:none}
.back{background:linear-gradient(180deg,#ffffff1c,#ffffff08);border:1px solid #ffffff2a;border-radius:14px;width:42px;height:42px;font-size:20px;color:#fff;cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s;backdrop-filter:blur(6px)}.back:hover{transform:translateX(-3px);box-shadow:0 0 16px var(--glow)}
/* glass panels */
.panel{background:linear-gradient(160deg,#ffffff0d,#ffffff03 40%),linear-gradient(180deg,#161f45e6,#0f1631e6);border:1px solid #ffffff1c;box-shadow:inset 0 1px 0 #ffffff1a,0 10px 30px #0006;border-radius:20px}
.mbox{background:linear-gradient(160deg,#ffffff10,#ffffff03 40%),linear-gradient(180deg,#18214b,#0e1530);border:1px solid #ffffff26;border-radius:22px;box-shadow:0 30px 80px #000c,0 0 60px #4a5cc033,inset 0 1px 0 #ffffff22;animation:pop .32s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.94)}}
#ov{background:radial-gradient(circle at 50% 40%,#1a2160f2,#03050df2 70%)}
/* buttons */
.btn{position:relative;overflow:hidden;background:linear-gradient(135deg,#ff9a2e,#ff4d6d 70%,#e0307f);box-shadow:0 6px 18px #ff4d6d44,inset 0 1px 0 #ffffff55,inset 0 -2px 0 #0003;text-shadow:0 1px 2px #0005;letter-spacing:.02em;transition:transform .18s var(--ease),box-shadow .2s,filter .2s}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,#ffffff55 50%,transparent 70%);transform:translateX(-120%);transition:transform .6s var(--ease);pointer-events:none}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px #ff4d6d66,inset 0 1px 0 #ffffff66,inset 0 -2px 0 #0003}.btn:hover::after{transform:translateX(120%)}
.btn:active{transform:translateY(1px) scale(.97);box-shadow:0 2px 8px #ff4d6d44}
.btn.s{background:linear-gradient(180deg,#2a3678,#1b2552);box-shadow:0 4px 14px #0006,inset 0 1px 0 #ffffff2a,inset 0 -2px 0 #0004;border:1px solid #ffffff1c}.btn.s:hover{box-shadow:0 8px 22px #3b4cc055,inset 0 1px 0 #ffffff3a;border-color:#7a8cff66}
.chip{background:linear-gradient(180deg,#232e6a,#161f48);border:1px solid #ffffff1f;box-shadow:inset 0 1px 0 #ffffff1f}.chip:hover{border-color:var(--ac);box-shadow:0 0 12px var(--glow)}
.chip.on{background:linear-gradient(135deg,#ff9a2e,#ff4d6d);border-color:transparent;box-shadow:0 0 16px #ff4d6d66,inset 0 1px 0 #ffffff55;color:#fff}
select,.inp,.search,input[type=text],input[type=password],textarea{background:#0e1536;border:1px solid #ffffff22;border-radius:10px;color:var(--tx);transition:border-color .2s,box-shadow .2s}
select:focus,.inp:focus,.search:focus,input:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px #ff7a1a33}
/* hero + tiles */
.hero{border:1px solid #ffffff26;box-shadow:0 20px 50px #0008,inset 0 1px 0 #ffffff26}
.hero .big{background:linear-gradient(180deg,#fff,#ffb347 60%,#ff4d6d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 18px #ff7a1a88);font-size:64px}
.big{text-shadow:none}
.tile{border:1px solid #ffffff2e;box-shadow:0 10px 26px #0007,inset 0 1px 0 #ffffff33,inset 0 -30px 40px #0003;transition:transform .25s var(--ease),box-shadow .25s,filter .25s}
.tile::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#ffffff2e 50%,transparent 65%);transform:translateX(-130%);transition:transform .7s var(--ease);pointer-events:none}
.tile:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 18px 40px #000a,0 0 30px var(--t1),inset 0 1px 0 #ffffff44}.tile:hover::before{transform:translateX(130%)}
.tile:active{transform:scale(.97)}
.tile .ic{filter:drop-shadow(0 4px 8px #0008);transition:transform .3s var(--ease)}.tile:hover .ic{transform:scale(1.18) rotate(-6deg)}
.tile b{text-shadow:0 2px 6px #0007}
.tile .bd,.bd{box-shadow:0 0 12px #ff3b4e,0 0 0 2px #0a0f1f}
.note{background:linear-gradient(90deg,#4a3410,#2c200a);border:1px solid #ffb34766;box-shadow:0 0 18px #ffb34722,inset 0 1px 0 #ffffff1a;border-radius:14px;transition:transform .2s var(--ease)}.note:hover{transform:translateX(3px)}
.tick{background:linear-gradient(90deg,#111a45,#0c1234);border:1px solid #ffffff1c;box-shadow:inset 0 1px 0 #ffffff14}
.evb{box-shadow:0 8px 30px #7a4cff44,inset 0 1px 0 #ffffff26;transition:transform .2s var(--ease),box-shadow .2s}.evb:hover{transform:translateY(-2px);box-shadow:0 12px 36px #7a4cff77}
.xp{height:12px;background:#080c22;border:1px solid #ffffff14;box-shadow:inset 0 2px 6px #000a}.xp i{background:linear-gradient(90deg,#ff7a1a,#ffc933,#ff7a1a);background-size:200% 100%;box-shadow:0 0 12px #ffb34799;animation:xps 3s linear infinite}
@keyframes xps{to{background-position:200% 0}}
/* cards */
.card{border-radius:16px;box-shadow:0 8px 22px #0009,inset 0 0 0 1px #ffffff1a;transition:transform .25s var(--ease),box-shadow .25s,filter .25s}
.card:hover{transform:translateY(-6px) scale(1.04);box-shadow:0 18px 36px #000b,0 0 26px var(--cc)}
.card.r1{box-shadow:0 8px 22px #0009,0 0 12px #3b9cff55}
.card.r2{box-shadow:0 8px 22px #0009,0 0 18px #b45cffaa}
.card.r3{box-shadow:0 8px 22px #0009,0 0 26px #ffc933bb,inset 0 0 14px #ffc93344}
.card.r4{box-shadow:0 8px 22px #0009,0 0 30px #ff3b4ecc,inset 0 0 14px #ff3b4e44}
.card.r4,.card.r5{overflow:hidden}
.card.r4::after,.card.r5::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,#ffffff88 50%,transparent 65%);transform:translateX(-100%);animation:shine 2.8s infinite;pointer-events:none;z-index:3}
.card.r5{box-shadow:0 8px 22px #0009,0 0 34px #7df9ffcc,inset 0 0 18px #7df9ff55}
.card.lock{box-shadow:none}
.card .nm,.plate .nm{text-shadow:0 1px 3px #000a}
.empty{border:2px dashed #ffffff33;background:repeating-linear-gradient(45deg,#ffffff06 0 8px,transparent 8px 16px);border-radius:16px}
.back{box-shadow:inset 0 0 30px #0008}
/* game */
.board{padding:6px 0}.board b{background:linear-gradient(180deg,#fff,#ffb347);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 10px #ff7a1a77);font-weight:900}
.feed div{border-bottom:1px solid #ffffff10}
table{border-collapse:separate;border-spacing:0}th{color:var(--mu);font-size:11px;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid #ffffff1a}td{border-bottom:1px solid #ffffff0a}
tr.star td{text-shadow:0 0 10px #ffc93366}
/* toast */
#toast{background:linear-gradient(135deg,#ffffff,#e9eeff);border:1px solid #fff;box-shadow:0 12px 40px #000a,0 0 24px #7a8cff55;border-radius:14px;animation:pop .28s var(--ease)}
/* page entrance */
@media (prefers-reduced-motion:no-preference){main>*{animation:rise .45s var(--ease) both}main>*:nth-child(2){animation-delay:.04s}main>*:nth-child(3){animation-delay:.08s}main>*:nth-child(4){animation-delay:.12s}main>*:nth-child(n+5){animation-delay:.16s}@keyframes rise{from{opacity:0;transform:translateY(12px)}}
 .hub .tile{animation:rise .5s var(--ease) both}.hub .tile:nth-child(2){animation-delay:.05s}.hub .tile:nth-child(3){animation-delay:.1s}.hub .tile:nth-child(4){animation-delay:.15s}.hub .tile:nth-child(n+5){animation-delay:.2s}}
@media (prefers-reduced-motion:reduce){.xp i,.card.r3::after,.card.r4::after,.card.r5::after{animation:none}}

 [4,5].forEach(r=>{const B=RBAND[r],L=PLAYERS.filter(p=>p.rar==r),tot=p=>ST.reduce((s,k)=>s+p[k],0),ts=L.filter(p=>p.id<ORIG_N).map(tot),lo=Math.min(...ts),hi=Math.max(...ts);
  L.forEach(p=>{const f=hi>lo?Math.max(0,Math.min(1,(tot(p)-lo)/(hi-lo))):.5,T=Math.round(B.tot[0]+f*(B.tot[1]-B.tot[0]));p.ovr=Math.round(B.ovr[0]+f*(B.ovr[1]-B.ovr[0]));
   // water-fill: raise every stat equally until the target total is reached, never past the cap (keeps each card's shape)
   let guard=0;while(tot(p)<T&&guard++<400){const open=ST.filter(k=>p[k]<B.cap);if(!open.length)break;const need=T-tot(p),add=Math.max(1,Math.floor(need/open.length));open.forEach(k=>{if(tot(p)<T)p[k]=Math.min(B.cap,p[k]+add)})}})})})();

/* ---- save safety: rolling backups + export/import ---- */
const BK_N=3,BK_GAP=10*6e4,bkKey=i=>KEY+'_bk'+i,SAVE_TAG='HDGM1:';let BK_LAST=0,BKX='';
function bkList(){const out=[];for(let i=1;i<=BK_N;i++){try{const r=localStorage.getItem(bkKey(i));if(r){const o=JSON.parse(r);if(o&&o.d)out.push({i,t:o.t,s:o.s||{},d:o.d})}}catch(e){}}return out}
function bkRoll(js,force){const n=Date.now();if(!force&&n-BK_LAST<BK_GAP&&n>=BK_LAST)return;BK_LAST=n;   // at most one new backup per 10 minutes (3 kept)
 try{const sum={coins:S.coins,gems:S.gems,cards:Object.keys(S.owned).length,lvl:Math.min(30,Math.floor(Math.sqrt((S.xp||0)/100))+1)};
  for(let i=BK_N;i>1;i--){const p=localStorage.getItem(bkKey(i-1));if(p)localStorage.setItem(bkKey(i),p)}
  localStorage.setItem(bkKey(1),JSON.stringify({t:n,s:sum,d:js}))}catch(e){}}
try{BK_LAST=(bkList()[0]||{}).t||0}catch(e){}
function exportCode(){return SAVE_TAG+btoa(unescape(encodeURIComponent(JSON.stringify(S))))}
function parseSave(txt){const raw=String(txt||'').trim();if(!raw)return{err:'Paste a backup code or choose a file first.'};
 try{let js;if(raw.startsWith(SAVE_TAG))js=decodeURIComponent(escape(atob(raw.slice(SAVE_TAG.length).replace(/\s+/g,''))));else if(raw[0]=='{')js=raw;else return{err:'That does not look like a Hoop Dynasty backup code.'};
  const o=JSON.parse(js);if(!o||typeof o!='object'||!o.lineup||typeof o.owned!='object'||!o.owned)return{err:'This backup is missing required data (lineup / cards).'};
  const m=migrate(o);return{s:m,sum:{coins:m.coins,gems:m.gems,cards:Object.keys(m.owned).length,lvl:Math.min(30,Math.floor(Math.sqrt((m.xp||0)/100))+1)}}}
 catch(e){return{err:'Could not read that code — it may be incomplete or damaged.'}}}

/* ===== RANKED MODE =====
 Eight tiers. Opponents are BOTS sized for your tier (team OVR range = 66 + 4*tier ... +10). There is no online play yet:
 rkFind() is the single place that produces opponents, so real players can be plugged in there later. */
const RK=[{n:'Rookie',e:'🌱',c:'#9aa3b5',at:0,coins:0,gems:0},{n:'Starter',e:'🏃',c:'#5fd18a',at:100,coins:500,gems:2},{n:'Veteran',e:'🎖️',c:'#4fc3f7',at:250,coins:1000,gems:3},{n:'Star',e:'⭐',c:'#ffd54a',at:450,coins:2000,gems:5},
 {n:'All-Star',e:'🌟',c:'#ff9a3c',at:700,coins:4000,gems:8},{n:'Superstar',e:'💫',c:'#c77dff',at:1000,coins:7000,gems:12},{n:'All-Time Great',e:'👑',c:'#ff5a7a',at:1400,coins:12000,gems:20},{n:'GOAT',e:'🐐',c:'#ff3b4e',at:1900,coins:25000,gems:40}];
const rkLo=i=>66+4*i,rkHi=i=>rkLo(i)+10,RK_SHIELD=3;       // bot team-OVR range per tier; promotion shield = games you can't be demoted
const RK_K=36;     // fame at stake per game (Elo-style): win = K × (1 − win chance), loss = 0.85 × K × win chance
const rkProj=(mt,opp)=>{const pw=winProb(mt,opp);return{pw,win:Math.max(4,Math.min(36,Math.round(RK_K*(1-pw)))),loss:Math.max(3,Math.min(32,Math.round(RK_K*pw*.85)))}};
const rkStreakBonus=()=>Math.min(10,2*S.rk.streak);      // +2 fame per win already in your streak, up to +10
const rkCoins=(win,t)=>win?60+40*t:20+10*t;
// Matchmaking: ONE random opponent sized for your tier, a little tougher the closer you are to promotion; never the same team twice in a row.
// This is the single place opponents come from — an online mode could return a real player's roster here.
function rkFindBot(){const r=S.rk,t=r.tier,next=t<7?RK[t+1].at:RK[7].at+800,frac=Math.max(0,Math.min(1,(r.fame-RK[t].at)/(next-RK[t].at)));let o,sig,k=0;
 do{const q=Math.max(0,Math.min(1,.1+.6*frac+(Math.random()-.5)*.6)),rt=Math.round(rkLo(t)+10*q);o=buildOpp(rt,pick(TEAMS));sig=o.name+'|'+Object.values(o.ids.lu).sort().join(',');k++}while(k<8&&sig==r.last);
 const w=Math.max(8,Math.min(66,Math.round(18+(o.ovr-60)*.85+ri(-3,3))));r.last=sig;r.match={ids:o.ids,pen:o.pen||0,name:o.name,gm:RIVALS[hashPw(sig)%RIVALS.length].n,rt:o.ovr,rec:w+'-'+(82-w)};save();return o}
// Real players first: when you are signed in online and another player's team is close to your rank, you play THEIR team. Otherwise a bot.
function rkFind(){const r=S.rk,u=typeof netPickRanked=='function'?netPickRanked():null;
 if(u){const d=shDecode(u.c);if(d.ok){const o=netOppFrom(u,'r');r.last='net:'+u.uid;r.match={net:{uid:u.uid,n:u.n,c:u.c},name:d.g.name,gm:u.n,rt:o.ovr,rec:u.w+'-'+u.l};netRankedPush(u.uid);save();return o}}
 if(typeof netRankedPush=='function')netRankedPush('bot');return rkFindBot()}
const rkMatchOpp=()=>{if(!S.rk.match)rkFind();let m=S.rk.match;if(m.net){const o=netOppFrom(m.net,'r');if(o)return o;rkFindBot();m=S.rk.match}return attachRival(oppFromIds(m.ids,m.name,m.gm,m.pen),m.name+'|'+Object.values(m.ids.lu).sort().join(','))};
function rkApply(win,pj,after){const r=S.rk;let d;
 if(win){d=pj.win+rkStreakBonus();r.streak++;r.w++}else{d=-pj.loss;r.streak=0;r.l++}
 const shielded=r.shield>0;r.fame=Math.max(0,r.fame+d);
 if(shielded){r.fame=Math.max(r.fame,RK[r.tier].at);r.shield--}
 after.push((d>0?'🏅 Fame +':'📉 Fame ')+d+(win&&r.streak>1?' (🔥 '+r.streak+' win streak)':'')+' · win chance was ~'+Math.round(pj.pw*100)+'%');
 rkPromote(after);
 if(r.shield<=0&&r.tier>0&&r.fame<RK[r.tier].at){r.tier--;after.push('⬇️ Demoted to '+RK[r.tier].e+' '+RK[r.tier].n)}
 r.best=Math.max(r.best,r.tier);r.match=null;return d}

function giveImmortal(after){const pool=PUBP.filter(p=>p.rar==5&&S.owned[p.id]==null);if(!pool.length){S.coins+=DUPE_COINS[5];after.push('🌈 You own every Immortal — +🪙 '+DUPE_COINS[5].toLocaleString());return null}
 const p=pick(pool);S.owned[p.id]=0;if(S.lineup[p.pos]==null)S.lineup[p.pos]=p.id;after.push('🌈 IMMORTAL CARD: '+p.name+' — '+p.moment+'!');confetti(420);return p}
function rkPromote(after){const r=S.rk;
 while(r.tier<7&&r.fame>=RK[r.tier+1].at){r.tier++;r.shield=RK_SHIELD;const T=RK[r.tier];after.push('⬆️ PROMOTED to '+T.e+' '+T.n+'!');
  if(!r.claimed.includes(r.tier)){r.claimed.push(r.tier);S.coins+=T.coins;S.gems+=T.gems;addXP(50*r.tier);after.push('🎁 First-time reward: 🪙 '+T.coins.toLocaleString()+' 💎 '+T.gems);confetti(200);if(r.tier==7)giveImmortal(after)}}
 r.best=Math.max(r.best,r.tier)}

 <p><b>Training</b> is timed. Pick a player and a stat, pay a coin fee (60 + 50 × points already on that stat, × (1 + 0.5 × rarity tier), less any facility discount), then wait. Time for the next point goes 2 → 5 → 10 → 20 → 40 → 75 min → 2 h → 3 h → 4 h → 6 h, × (1 + 0.2 × rarity tier), divided by your facility's speed. When it finishes press <b>Collect</b> for +1. You can <b>Skip</b> for 🪙 20 + 8 per minute left (free in the final minute) or Cancel for half your fee back. Selling or trading a training player refunds the fee. Training players still play. Cap per stat = lowest of 3 + GM level, 10 and your facility's cap. Every 3 trained points add +1 overall.</p>`)+
 d('🏆 Seasons, difficulty & title streaks',`<p>A season is 12 games — win 6 to make the 3-round playoffs. Opponents run from (difficulty) to (difficulty + 24) rated; the playoffs are +24/+27/+30. League difficulty starts at ${DSTART} and adapts: <b>win the title +4</b> · lose in round 1 −3 · miss the playoffs −4 · lose a later round: unchanged. It stays between ${DMIN} and ${DMAX}, so a weak team can always recover. Back-to-back titles pay 🪙 1,000 + 💎 5; a <b>Three-Peat</b> pays 🪙 3,000 + 💎 15 (and each title makes the next season harder!).</p>`)+
 d('🏅 Ranked & fame',`<p>Eight tiers: ${RK.map((x,i)=>x.e+' '+x.n+' (bots '+rkLo(i)+'–'+rkHi(i)+')').join(' · ')}. Ranges overlap so tiers feel connected. Bots are fictional GMs (online play may come later).</p>
 <ul><li><b>Matchmaking</b>: one random opponent per game, sized for your tier and a little tougher near promotion. Before you play you see their roster, their overall and the fame at stake.</li><li><b>Fame is based on the real win chance</b>: a win pays 36 × (1 − win chance) (min 4, max 36), plus +2 per win already in your streak (max +10). A loss costs 0.85 × 36 × win chance (min 3, max 32) — so beating a stronger team pays a lot and losing to a weaker one hurts.</li><li>Fame thresholds: ${RK.map(x=>x.at).join(' / ')}. After a promotion you get a <b>${RK_SHIELD}-game shield</b>: you can't be demoted. Fall below your tier's threshold with no shield and you drop a tier.</li><li>Every game pays 🪙 (win 60 + 40×tier, loss 20 + 10×tier). Each tier pays a one-time promotion reward.</li></ul>`)+
 d('⭐ GM level & rewards',`<p>Level L needs 100 × (L−1)² XP. XP comes from games, missions, achievements and awards. Unlocks: ${Object.entries(LU).map(([l,u])=>'Lv '+l+' '+u).join(' · ')}. Training cap rises with level too.</p>`)+
 d('🛍️ Shop, packs & featured player',`<p>Free pack every 8 hours (Goals tab). Duplicates become coins you can spend on more packs. The <b>Featured Player</b> is a guaranteed Legendary (🪙 15,000 / 💎 120) or Mythic (🪙 60,000 / 💎 400), refreshed every 24 hours — never someone you already own.</p>`)+
 d('📅 Daily challenge',`<p>Every day has a new <b>lineup rule</b>: ${DCR.map(r=>r.e+' '+r.n).join(' · ')}. Play it with your own lineup if it follows the rule, or with an <b>auto-built squad</b> made from your best eligible cards — your real lineup is never changed.</p><ul><li>Three difficulties: ${DC_REW.map(r=>r.e+' '+r.n+' (opponent '+(r.off>0?'+':'')+r.off+' vs your best valid squad) pays 🪙 '+r.c+(r.g?' 💎 '+r.g:'')).join(' · ')}.</li><li>${DC_TRIES} tries per difficulty per day. A loss pays a small 🪙 25 consolation. Only the first clear of each difficulty pays out.</li><li>Your first clear each day extends your <b>streak</b> (bonus 🪙 50 per streak day, up to 7 days). Clear all three for a Clean Sweep (+💎 ${DC_SWEEP_GEMS}).</li></ul>`)+
 d('🧑‍🏫 Staff & Team Packs',`<p>Team Packs (Shop or Staff screen) contain <b>staff cards</b>: <b>Head Coaches</b> (1 slot: +team OVR, +% coins or +% XP), <b>Training Facilities</b> (1 slot: training slots, speed, fee discount and stat cap) and <b>Scouts</b> (1 slot, 2nd at GM level ${SCOUT2_LV}: better pack luck, duplicate coins, sell value, trade premium, free-pack bonuses). Rarities: ${SRAR.join(' · ')}. A copy of a card you own levels it up (copies needed: ${STAFF_NEED.join(', ')} for Lv 2–${STAFF_MAX}); copies of a maxed card pay coins. Packs: ${STAFF_PACKS.map(p=>p.name+' (🪙 '+p.coins.toLocaleString()+(p.gems?' / 💎 '+p.gems:'')+', GM '+p.lv+')').join(' · ')}. You start with a free Neighborhood Court (1 slot, cap 4). Coach bonuses only help your own team, never opponents. Tap ⬆ on a staff card to level it with coins instead of waiting for copies (cost = base × 2 per level: Common 🪙 600, Rare 1,800, Epic 5,000, Legendary 15,000 for Lv 2, doubling each level). Special coaches speed up SHO/3PT or DEF/REB training, and Dr. Cole lowers the injury chance in Hard Mode.</p>`)+
 d('🎲 Sim, opponents & scouting',`<p>Opponents are built from real cards in the game. Before every game you see a scouting report: their five, bench, overall and your win chance. A game's winner is decided by the rating gap (about +5 → 85%, +10 → 95%, +15 → 98%, +20 → 99.5%, even → 50%), then a real box score is simulated to match. <b>Sim to playoffs</b> / <b>Sim season</b> on the Play screen play your games with full rewards and stats and show a summary.</p>`)+
 d('💾 Saves & backups',`<p>Your game is stored in this browser. In Settings you can <b>export</b> a backup code or file and <b>import</b> it later (your current save is backed up first). The game also keeps <b>${BK_N} automatic backups</b> (one every ${BK_GAP/6e4} minutes) that you can restore. Clearing browser data erases everything, so export now and then.</p>`)+
 d('🧩 Roles & chemistry',`<p>Every card has one role based on its stats and position: ${ROLE_ORDER.map(k=>roleChip(k)+' '+ROLES[k][1]).join(' · ')}. Roles never change a card's own rating. Your starting five earns team OVR bonuses from role combinations: ${RSYN.filter(x=>x.b>0).map(x=>x.n+' ('+x.d+', +'+x.b+')').join('; ')}. Penalties: ${RSYN.filter(x=>x.b<0).map(x=>x.n+' ('+x.d+', '+x.b+')').join('; ')}. Opponents get synergies too. ⚡ Auto-pick now weighs chemistry, and ❓ Why this lineup? compares it with the old highest-rating five.</p>`)+
 d('💾 Lineup presets',`<p>Save up to ${PRE_MAX} named setups (starting five, bench and tactics) and apply them in one tap. If a card in a preset was sold or traded, the slot is auto-filled with your best available card. In Hard Mode, injured starters still swap out automatically.</p>`)+
 d('↩ Undo & 🛡 protection',`<p>Selling shows an Undo bar for ${UNDO_MS/1000} seconds. Undo restores the cards with their training, prestige and lineup spot, and takes the coins back (you need to still have them). Protected cards (🛡) are skipped by bulk sells and multi-select sells: you can protect cards by hand, and automatic rules cover your lineup and bench, the card you need for an unfinished set, the cheapest card for each open bounty, preset cards and wishlist cards. Change the rules in Settings.</p>`)+
 d('📆 Login calendar',`<p>A 28-day reward calendar (Days 7, 14, 21, 28 give gems and packs; coins climb each day). Missing exactly one day uses a 🛟 grace token (earned every 7th day, max 2). After each full cycle your coin rewards grow +10% (max +50%). Claims need a new calendar day and at least ${LOGIN_GAP/36e5} hours since the last claim; a clock set backwards blocks claiming.</p>`)+
 d('🆚 Playoff series',`<p>Make the playoffs with 6 wins in 12 games and you face three <b>best-of-7</b> series (first to ${SER_WINS}): ${RND_N.join(', ')}. Each game pays 🪙 ${SER_GAME.join(' / ')} by round (a loss pays 🪙 ${SER_LOSS}); winning a series adds 🪙 ${SER_BONUS.join(' / ')} and 💎 ${SER_GEMS.join(' / ')}, and the title adds 🪙 ${CHAMP_C} and 💎 ${CHAMP_G}. Between games you can change tactics, or use <b>Sim the series</b> / <b>Sim season</b> — the same rules apply either way. The bracket shows the whole postseason; the other series are decided by the league and look the same after a reload.</p>`)+
 d('📜 Franchise timeline',`<p>A log of your seasons, titles, series, 20+ point wins, trades, Legendary-and-better pulls, prestige, completed sets, rival milestones and awards. Old saves are filled in from your season history, best win, sets, prestige and rival records. It keeps the last ${TL_MAX} events and drops the oldest minor ones first.</p>`)+
 d('📰 News & press conferences',`<p>Short headlines are generated from your streaks, upsets, blowouts, series, titles, pulls and rival chatter, plus hourly league gossip. Now and then a reporter asks a question; the three answers trade safety for upside and change your <b>locker-room mood</b> (a team-OVR bonus or penalty of up to ±2 that lasts 1–2 games). Answers are never required.</p>`)+
 d('🎉 Pack events',`<p>Every ${EV_LEN/36e5} hours (UTC calendar) a new themed <b>Event Pack</b> goes live: ${EV_N} cards for 🪙 ${EV_PRICE.coins} or 💎 ${EV_PRICE.gems}, limit ${EV_CAP} per event. Base odds: ${EV_ODDS.map((v,i)=>RAR[i]+' '+v+'%').join(' · ')}. Position and role events make matching cards ${EV_W}× as likely; Epic Hour doubles Epic odds, Mythic Moon doubles Mythic-and-up, Double Dupes pays twice for duplicates, Fresh Faces re-rolls a duplicate once. The schedule never repeats an event twice in a row and does not depend on your device clock being right.</p>`)+
 d('💛 Wishlist',`<p>Mark up to ${WISH_MAX} cards as wanted (♡ in the card viewer or on the Wishlist screen). They show a 💛 badge in the trade market, bounties, pack events and your collection, the Wishlist screen shows where each one is available, and owned wished cards are protected from bulk sells (you can turn that off in Settings).</p>`)+
 d('🔭 Draft scouting',`<p>Each draft candidate has a hidden potential: ${SC_TIERS.map(t=>t.e+' '+t.n+' (+'+t.lv+' free training levels)').join(', ')}. You get ${SC_BASE} scout points, plus bonuses from scouts in Staff. <b>Look</b> costs ${SC_LOOK} (tells Bust/Solid from Rising/Gem), <b>Full</b> costs ${SC_FULL}. Auto draft still works and favors scouted prospects.</p>`)+
 d('👻 Share a team',`<p>Your team code holds your starters, 3 bench players, their training, tactics and a name. Import a friend\'s code to play it as a <b>ghost opponent</b> in Exhibition (payout like a normal exhibition). Damaged or edited codes are rejected, and cards are capped at normal rarity limits, so a code cannot create super-players.</p>`)+
 d('✨ Effects',`<p>Pack reveals escalate by rarity: Epic flashes, Legendary adds a gold glow and shake, Mythic adds fireworks and a purple shock wave, Immortal adds a white-out, big shake, a fireworks finale and its own sound. Set the intensity in Settings (Full / Light / Off); phones with reduced motion use Light, and "Skip pack animation" keeps everything quick. All sounds are generated, no audio files.</p>`)+
 d('🎁 Card sets',`<p>${SETS.length} sets: ${SETS.map(s=>s.e+' '+s.n).join(' · ')}. Own every card to claim a one-time reward (coins, gems or a Staff Pack). Rarity sets count how many cards of that rarity you own.</p>`)+
 d('😤 Rival GMs',`<p>${RIVALS.length} rival GMs run every opponent team and keep a head-to-head record against you. Lose to one 3 times in a row and your next win over him pays a 🔥 <b>revenge bonus</b> (🪙 1,500 + 300 per extra loss, 💎 3 + 1 per extra loss, capped at 8 extra).</p>`)+
 d('🎛 Tactics',`<p>On the Roster screen choose a <b>pace</b> (Slow / Normal / Fast) and a <b>defense</b> (Man / Zone / Press). Each gets a <b>fit</b> in team-OVR points (−1.5 to +1.8) from how your starters' stats suit it: Fast likes athleticism + passing, Slow likes shooting + rebounding, Zone likes strong bigs, Press likes athletic defenders (and is riskier). Normal pace is always 0. Fast adds possessions to the game, Slow removes some; Zone cuts 2-point shots but invites threes; Press steals more but gives up easier shots. ★ marks the best fit; ⚡ Apply recommended sets it.</p>`)+
 d('🏆 Weekly Event',`<p>Every week has a lineup rule from the Daily Challenge rule system plus a few extras. You get ${WK_TRIES} tries at a ${WK_ROUNDS}-round bracket (opponents about ${WK_OFF.map(o=>(o>0?'+':'')+o).join(' / ')} OVR vs your squad). Lose and the run ends. Rewards by rounds cleared: ${WK_PAY.slice(1).map((p,i)=>(i+1)+': 🪙 '+p.toLocaleString()+(WK_GEM[i+1]?' 💎 '+WK_GEM[i+1]:'')).join(' · ')}. Clearing all ${WK_ROUNDS} also gives an Elite Staff Pack. Score = 100 per round + point margin; the leaderboard compares you to AI GMs.</p>`)+
 d('📋 Bounties',`<p>AI teams post ${BNT_N} requests (a rarity, a position, a minimum rating or a specific player). Fill one with a matching card for 🪙 ${BNT_PAY.slice(0,5).map(x=>x.toLocaleString()).join(' / ')} by rarity (+💎 for Epic and above; specific-player requests pay 50% more). New requests every ${BNT_CD/36e5}h, each lasts ${BNT_LIFE/36e5}h. Scouts boost payouts.</p>`)+
 d('⭐ Card prestige',`<p>A card with every stat trained +10 (or at its rating cap) can be <b>prestiged</b> up to ${PR_MAX} times: 🪙 ${PR_COST.map(x=>x.toLocaleString()).join(' / ')} × (1 + 0.5 × rarity) and 💎 ${PR_GEM.join(' / ')}. Each level gives a gold border and +${PR_BONUS} team OVR while he starts, and +20% sell value. Selling or trading a card loses its prestige.</p>`)+
 d('📊 Stats, Compare & Trophy Room',`<p>The Stats screen shows win rate by mode, career leaders, titles, best seasons, pack pulls and rarity progress. Open any card and tap <b>⚖️ Compare</b> on two cards to see them side by side. The Trophy Room collects your titles, awards, sets, rivals and more.</p>`)+
 d('💀 Hard Mode',`<p>Optional (Settings). Opponents get +${HARD_OPP} OVR, every game each starter and top-3 bench player has a ${Math.round(HARD_INJ*100)}% chance of missing 1–3 games (injured starters are replaced automatically), and you earn ×${HARD_COIN} coins and ×${HARD_XP} XP. Injuries never happen with Hard Mode off.</p>`)+
 d('💡 Tips to build a dynasty',`<ul><li>Fill all five positions first — Balanced Five is an easy +2.</li><li>Build around stats that unlock synergies: shooting, defense, a passing PG and a rebounding C.</li><li>Open packs often; sell spare Commons for coins and train your starters instead of hoarding.</li><li>Use Exhibition and Ranked to practice — season difficulty only changes when a season ends.</li><li>Check your closest achievements on Home — they pay coins and gems.</li><li>Trade up: offer two good cards for one great one if the premium works out.</li></ul>`)}
function settingsView(){return`${pageHead('Settings & Info','Options, photos and how everything works')}
 <div class="panel"><h3>⚙️ Preferences</h3><div class="setrow"><span>🔊 Sound effects</span><button class="btn s" data-a="snd">${S.snd?'On':'Off'}</button></div>
 <div class="setrow"><span>📱 Menu layout <small class="odds">(Auto detects phones)</small></span><select data-opt="menumode">${[['auto','Auto'],['phone','Phone'],['desktop','Desktop']].map(([v,l])=>`<option value="${v}" ${(S.menuMode||'auto')==v?'selected':''}>${l}</option>`).join('')}</select></div>
 <div class="setrow"><span>📺 Watch games play out live <small class="odds">(off = instant final screen)</small></span><input type="checkbox" data-opt="live" ${S.live?'checked':''}></div>

 <div class="setrow"><span>▶ Preview an effect</span><span class="row"><button class="btn s" data-a="fxtest" data-v="3">Legendary</button><button class="btn s" data-a="fxtest" data-v="4">Mythic</button><button class="btn s" data-a="fxtest" data-v="5">Immortal</button></span></div>
 <div class="setrow"><span>📷 Show real player photos <small class="odds">(needs internet)</small></span><input type="checkbox" data-opt="photoOn" ${S.photoOn!==false?'checked':''}></div>
 <div class="setrow"><span>🎬 Intro scene</span><button class="btn s" data-a="replayintro">Replay intro</button></div>
 <div class="setrow"><span>💡 Tutorial hints</span><input type="checkbox" data-opt="hints" ${S.hints.on?'checked':''}></div>
 <div class="setrow"><span>↺ Show all hints again</span><button class="btn s" data-a="hintreset">Reset hints</button></div></div>

 <div class="panel"><h3>ℹ️ Info — how everything works</h3>${infoHTML()}</div>
 ${hardHTML()}${protHTML()}${saveHTML()}<div class="panel"><h3>⚠️ Danger zone</h3><button class="btn s" data-a="reset">Reset Game</button></div>${adminPanel()}`}

 if(!best)return null;const ids=new Set(best.map(p=>p.id)),bn=[];

/* ===== SIM CALIBRATION =====
 The WINNER comes from a calibrated probability of the team-power gap (logistic, steepness WIN_K). The game you watch is then simulated possession by
 possession until its real score agrees with that outcome — so the play-by-play and box score are always genuine and believable, yet results follow the ratings.
 Power = team overall (already includes synergies) + a small nudge for how good the actual stats and traits are. */
const SIM_COMP=0.5;   // how much of a rating gap shows up inside each possession (the winner itself is decided by WIN_K below)
const WIN_K=0.31;     // gap +5 → ~82%, +10 → ~95%, +15 → ~99%, +20 → ~99.8%
const statMean=a=>a.reduce((x,p)=>x+(p.shooting+p.three+p.passing+p.defense+p.rebounding+p.athleticism)/6,0)/a.length;

// Put a player in a starting slot (his own position or an adjacent one). A displaced starter swaps into the old slot if he fits, else goes to the bench.
function setStart(id,slot){const p=PLAYERS[id];slot=slot||p.pos;if(!canPlay(p,slot)){toast(p.name+' can only start at '+elig(p).join(' / '));return false}
 if(S.lineup[slot]==id)return true;
 const cur=S.lineup[slot],from=POS.find(x=>S.lineup[x]==id),wasB=S.bench.includes(id);
 const toB=cur!=null&&!(from&&canPlay(PLAYERS[cur],from));
 if(toB&&S.bench.length-(wasB?1:0)>=benchCap()){toast('Bench is full ('+benchCap()+') — remove a bench player first.');return false}
 if(from)S.lineup[from]=null;S.bench=S.bench.filter(x=>x!=id);
 if(cur!=null){if(from&&canPlay(PLAYERS[cur],from))S.lineup[from]=cur;else S.bench.push(cur)}
 S.lineup[slot]=id;return true}

function toBench(id){const inB=S.bench.includes(id);if(inB)return true;if(S.bench.length>=benchCap()){toast('Bench is full ('+benchCap()+') — remove a bench player first.');return false}

async function netPoll(force){if(!netOn()||NET.polling)return;if(!force&&Date.now()-NET.lastPoll<8000)return;NET.polling=true;NET.lastPoll=Date.now();let changed=false;
 try{const me=NET.au.uid,j=await netDb('GET','box/'+me)||{},m=mp(),del={};
  prof();const req={};Object.keys(j.req||{}).forEach(from=>{const q=j.req[from];if(!netIdOk(from)||!q||typeof q!='object')return;if(m.blk[from]){del['req/'+from]=null;return}
   if(q.acc){if(m.fr[from])m.fr[from].ok=1;else m.fr[from]={n:nx(q.n)||'player',ok:1};netFeed('🤝 '+(nx(q.n)||'A player')+' accepted your friend request');del['req/'+from]=null;changed=true}
   else if(m.fr[from]&&!m.fr[from].ok){m.fr[from].ok=1;del['req/'+from]=null;netDb('PUT','box/'+from+'/req/'+me,{n:NET.au.name,acc:1,t:Date.now()}).catch(()=>{});changed=true}   // we both asked each other → friends
   else if(m.fr[from]&&m.fr[from].ok){del['req/'+from]=null}
   else req[from]={n:nx(q.n)||'player',t:+q.t||0}});
  Object.keys(j.mt||{}).forEach(id=>{if(!netIdOk(id))return;try{netApplyMatch(j.mt[id])}catch(e){}del['mt/'+id]=null;changed=true});
  const tr={};Object.keys(j.tr||{}).forEach(id=>{const t=j.tr[id];if(!netIdOk(id)||!t||typeof t!='object'||!netIdOk(t.from)||!netIdOk(t.to))return;const mine=t.from==me;
   if(mine&&t.st=='acc'){if(!m.proc[id]){netTradeCollect(id,t);changed=true}netDb('PATCH','box/'+t.to+'/tr/'+id,{st:'done'}).catch(()=>{});del['tr/'+id]=null}
   else if(mine&&(t.st=='dec'||t.st=='can')){if(netEscrowBack(id)){netFeed('↩️ '+(nx(t.tn)||'Your friend')+' declined your trade — your cards are back');changed=true}del['tr/'+id]=null}
   else if(mine&&t.st=='done'){del['tr/'+id]=null}
   else if(mine&&t.st=='open'&&!m.esc[id]){del['tr/'+id]=null}                       // a leftover copy of an offer that was already cancelled
   else if(!mine&&(t.st=='can'||t.st=='done'||t.st=='dec')){del['tr/'+id]=null}
   else if(!mine&&m.blk[t.from]&&t.st=='open'){netDb('PATCH','box/'+t.from+'/tr/'+id,{st:'dec'}).catch(()=>{});del['tr/'+id]=null}
   else tr[id]=t});
  if(JSON.stringify(req)!=JSON.stringify(NET.box.req)||JSON.stringify(tr)!=JSON.stringify(NET.box.tr))changed=true;NET.box={req,tr};
  if(Object.keys(del).length)await netDb('PATCH','box/'+me,del).catch(()=>{});
  if(changed){const k=Object.keys(m.proc);if(k.length>60)k.slice(0,k.length-60).forEach(x=>delete m.proc[x]);save();netRefresh()}NET.err=''}
 catch(e){netFail(e,true)}finally{NET.polling=false}}

 if(!f){const ids=Object.keys(m.fr).filter(u=>m.fr[u].ok);return`<div class="panel"><h3>💬 Messages</h3>${ids.map(u=>{const L=m.chat[u]||[],last=L[L.length-1],n=m.chu[u]|0,us=netUser(u);return`<div class="opp" data-a="netchatopen" data-v="${u}" style="cursor:pointer"><div style="display:flex;gap:10px;align-items:center;min-width:0">${netAvatar(us||{},38)}<div style="min-width:0"><b>${nesc(m.fr[u].n)}</b>${us?netDot(us.t):''}<br><span class="odds" style="display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:52vw">${last?(last.me?'You: ':'')+nesc(last.x):'No messages yet'}</span></div></div>${n?`<b class="nav-badge" style="position:static">${n}</b>`:''}</div>`}).join('')||'<div class="odds">Add a friend to start chatting.</div>'}<div class="odds" style="margin-top:8px">Only friends can message you. Block anyone from their profile.</div></div>`}
 if(m.chu[uid]){m.chu[uid]=0;save()}const L=m.chat[uid]||[],us=netUser(uid);
 return`<div class="panel"><div class="row" style="align-items:center;gap:10px"><button class="btn s" data-a="netchatopen" data-v="">←</button>${netAvatar(us||{},34)}<b data-a="netprof" data-v="${uid}" style="cursor:pointer">${nesc(f.n)}</b>${us?netDot(us.t):''}</div>
 <div class="nchat" id="netChatLog">${L.map(x=>`<div class="nmsg${x.me?' me':''}"><span>${nesc(x.x)}</span><i>${netAgo(x.t)}</i></div>`).join('')||'<div class="odds" style="text-align:center;margin:20px 0">Say hi 👋</div>'}</div>
 <div class="row" style="gap:8px"><input class="inp" id="netMsg" maxlength="200" autocomplete="off" placeholder="Message ${nesc(f.n)}…" style="flex:1;min-width:0"><button class="btn" data-a="netsend" data-v="${uid}">Send</button></div>
 <div class="chips" style="margin-top:8px">${['GG! 🏀','Rematch? ⚔️','Want to trade? 🔁','Nice team 🔥','Good luck 🍀'].map(q=>`<button class="chip" data-a="netquick" data-v="${q}">${q}</button>`).join('')}</div></div>`}

/* ---- actions ---- */
function netRun(fn,okMsg){if(NET.busy)return;NET.busy=true;Promise.resolve().then(fn).then(r=>{NET.busy=false;NET.err='';const t=typeof r=='string'&&r?r:okMsg;renderTop();render();if(t)toast(t)},e=>{NET.busy=false;const t=e&&e.text?e.text:netErrText(e);renderTop();render();toast(t)})}
const netCopy=(txt,sel)=>{const done=()=>toast('📋 Copied'),fb=()=>{const o=$(sel);if(o){o.focus();o.select();try{document.execCommand('copy');done()}catch(e){}}};try{if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,fb);else fb()}catch(e){fb()}};
Object.assign(ACT,{
 nettab:v=>{NET.tab=v;if(v!='trades')NET.trd=null;render();if(v=='friends'){netPool().then(netRefresh,()=>{});netFriendCheck()}if(v=='rank')netPool(true).then(netRefresh,()=>{});netPoll()},
 netcode:()=>{const c=netSetupParse(($('#netCode')||{}).value);if(!c){toast('That is not a valid setup code.');return}NET.cfg=c;netSaveLocal();render();toast('✅ Online play is set up — create an account')},
 netcfg:()=>{const c=netCfgClean({apiKey:($('#netKey')||{}).value,dbUrl:($('#netUrl')||{}).value});if(!c){toast('Check both values: the key starts with AIza… and the URL starts with https:// and ends in firebaseio.com or firebasedatabase.app');return}NET.cfg=c;netSaveLocal();render();toast('✅ Saved — now create your account')},
 netunset:()=>askConfirm('Remove the online setup from this device?',()=>{NET.cfg=null;netSignOutLocal();render()}),
 netcopyrules:()=>netCopy(NET_RULES,'#netRules'),netcopycode:()=>netCopy(netSetupCode(),'#netShare'),
 netauth:v=>{const n=(v=='up'?($('#netEmail')||{}):($('#netName')||{})).value,p=($('#netPw')||{}).value;NET.msg='';netRun(()=>netAuth(v,n,p).then(()=>{if(!NET.au||!NET.au.name)return'';const t=NET.msg2||(v=='up'?'🎉 Account created — welcome!':'👋 Signed in');NET.msg2='';return t}))},
 netout:()=>askConfirm('Sign out? Your game is saved to your account first.',()=>{closeModal();const go=()=>{netSignOutLocal();tab='home';render()};netBackup().then(go,go)}),
 netadd:()=>{const n=($('#netFriend')||{}).value;netRun(()=>netFriendAdd(n))},
 netreq:v=>{const yes=v[0]=='y',u=v.slice(2);netRun(()=>netFriendAnswer(u,yes).then(()=>netPool(true).catch(()=>{})),yes?'🤝 Friend added':'Request declined')},
 netunfriend:v=>{const f=mp().fr[v];if(!f)return;askConfirm('Remove '+nx(f.n)+' from your friends?',()=>netRun(()=>netFriendRemove(v),'Friend removed'))},
 netrefresh:()=>netRun(()=>Promise.all([netPool(true),netPoll(true)]),'🔄 Updated'),
 net1v1:v=>{const f=mp().fr[v],u=netUser(v);if(!f||!f.ok||!u){toast('That friend has not published a team yet.');return}const o=netOppFrom(u,'f');if(!o){toast('Their team could not be loaded (they may be on a different game version).');return}openMatch('ex',{net:{uid:u.uid,n:u.n,c:u.c}})},
 nettrade:v=>{const f=mp().fr[v],u=netUser(v);if(!f||!f.ok)return;if(netFlag()){toast('This save has used admin tools or Developer cards, so it cannot trade online.');return}if(u&&u.fl){toast(nx(f.n)+' is on an admin save, which cannot trade.');return}
  NET.tab='trades';NET.trd={uid:v,n:nx(f.n),give:[],want:[],coins:0,theirs:null,err:''};render();const T=NET.trd;netDb('GET','cards/'+v).then(s=>{T.theirs=new Set(String(s||'').split(',').map(Number).filter(i=>Number.isInteger(i)&&PLAYERS[i]&&!PLAYERS[i].custom));if(NET.trd===T&&tab=='online')render()},e=>{T.err=netErrText(e);if(NET.trd===T&&tab=='online')render()})},
 nettradex:()=>{NET.trd=null;render()},
 nettg:v=>{const T=NET.trd;if(!T)return;const side=v[0],id=+v.slice(2),L=side=='g'?T.give:T.want,i=L.indexOf(id),ci=$('#netCoins');if(ci)T.coins=Math.max(0,Math.min(S.coins,Math.floor(+ci.value||0)));
  if(i>=0)L.splice(i,1);else{if(L.length>=NET_TR_MAX){toast('Up to '+NET_TR_MAX+' cards per side.');return}L.push(id)}const sc={};document.querySelectorAll('[data-nl]').forEach(e=>sc[e.dataset.nl]=e.scrollTop);const q={};document.querySelectorAll('[data-nf]').forEach(e=>q[e.dataset.nf]=e.value);render();
  document.querySelectorAll('[data-nf]').forEach(e=>{e.value=q[e.dataset.nf]||'';netFilter(e)});document.querySelectorAll('[data-nl]').forEach(e=>e.scrollTop=sc[e.dataset.nl]||0)},
 nettradesend:()=>{const T=NET.trd,ci=$('#netCoins');if(!T)return;if(ci)T.coins=Math.max(0,Math.min(S.coins,Math.floor(+ci.value||0)));netRun(()=>netTradeSend(),'📨 Offer sent — your cards are held until they answer')},
 nettr:v=>{const yes=v[0]=='y',id=v.slice(2);if(yes)askConfirm('Accept this trade? The cards move right away.',()=>netRun(()=>netTradeAnswer(id,true)));else netRun(()=>netTradeAnswer(id,false))},
 nettrcancel:v=>netRun(()=>netTradeCancel(v),'Offer cancelled — your cards are back'),
 netbk:()=>netRun(()=>netBackup(),'☁️ Backed up'),
 netrs:()=>netRun(()=>netRestore().then(r=>{askConfirm(`Load your cloud save (${r.sum.cards} cards, 🪙 ${r.sum.coins.toLocaleString()}, GM level ${r.sum.lvl})? It replaces the game on this device. The current one is kept in your automatic backups.`,()=>{applySave(r.s);tab='online';render()});return''}))
});

Object.assign(ACT,{
 netgm:v=>{NET.gm=v;NET.msg='';render();const f=$(v=='forgot'?'#netFgEmail':v=='up'?'#netEmail':'#netName');if(f&&!f.value)f.focus()},
 netprof:v=>{if(v)netOpenProfile(v)},
 netviewme:()=>{NET.meTab='view';ACT.tab('me')},
 metab:v=>{closeModal();NET.meTab=v;if(tab!='me')ACT.tab('me');else render();if(v=='acct')netEmailCheck().then(()=>{if(tab=='me')render()},()=>{})},
 netscview:v=>{const z=NET.scv;if(!z||!z.u.sc[+v])return;const c=z.u.sc[+v],b=PLAYERS[c.id],p=pBuild(b,0,c.tr,c.pr),tt=c.tr.reduce((a,x)=>a+x,0);
  modal(`<div class="scv"><div class="scv-card">${card(p)}</div><div class="scv-info"><h3 style="margin:0">${nesc(b.name)}</h3><div class="odds" style="color:var(--c${b.rar});font-weight:800">${RAR[b.rar]} · ${b.pos}${b.moment?' · '+nesc(b.moment):''}</div>
  <div class="scv-ovr"><b>${p.ovr}</b><span>OVR${p.ovr>b.ovr?` <i>(base ${b.ovr})</i>`:''}</span></div>
  ${STATS.map((k,i)=>`<div class="scv-st"><span>${['Shooting','3-point','Passing','Defense','Rebounding','Athleticism'][i]}</span><div class="scv-bar"><i style="width:${Math.min(100,p[k]/1.2)}%"></i></div><b>${p[k]}</b>${c.tr[i]?`<em>+${c.tr[i]}</em>`:''}</div>`).join('')}
  <div class="odds" style="margin-top:8px">💪 Training: ${tt}/60 levels${c.pr?` · ⭐ Prestige ${'★'.repeat(c.pr)}`:''}</div>
  ${p.trt&&p.trt.length?`<div class="scv-tr">${p.trt.map(t=>`<div><b>${TRAIT[t][0]} ${TRAIT[t][1]}</b><span>${TRAIT[t][2]}</span></div>`).join('')}</div>`:''}</div></div>
  <div class="row" style="margin-top:12px;gap:8px">${z.ctx=='pop'?`<button class="btn s" data-a="netscback">← Back to profile</button>`:''}<button class="btn s" data-a="close">Close</button></div>`)},
 netscback:()=>{const z=NET.scv;if(z)modal(netProfileHTML(z.u,'pop'))},
 meopen:()=>{NET.meTab='view';ACT.tab('me')},
 socialtab:v=>{NET.tab=v;NET.chatWith=null;NET.trd=null;ACT.tab('online')},
 netforgot:()=>{const e=($('#netFgEmail')||{}).value;netRun(()=>netForgot(e).then(t=>{NET.msg=t;NET.lastId=String(e||'').trim().toLowerCase();return''}))},
 netaddem:()=>{const e=($('#netAddEm')||{}).value;netRun(()=>netAddEmail(e))},
 netemcheck:()=>netRun(()=>netEmailCheck(true).then(()=>'')),
 netemresend:()=>netRun(()=>netResendVerify()),
 netedit:()=>{closeModal();NET.meTab='edit';ACT.tab('me')},
 netfind:()=>{const n=String(($('#netFriend')||{}).value||'').trim().toLowerCase();if(!netNameOk(n)){toast('Type an exact username (3–14 letters, numbers or _).');return}netDb('GET','names/'+n).then(uid=>{if(!netIdOk(uid)){toast('No player called "'+n+'" was found.');return}netOpenProfile(uid)},e=>toast(netErrText(e)))},
 netpfadd:v=>{closeModal();netRun(()=>netFriendAdd(v))},
 netcl1v1:v=>{closeModal();ACT.net1v1(v)},netcltrade:v=>{closeModal();ACT.tab('online');ACT.nettrade(v)},
 netclchat:v=>{closeModal();NET.tab='chat';NET.chatWith=v;ACT.tab('online');netPoll(true)},
 netchatopen:v=>{NET.tab='chat';NET.chatWith=v||null;render();const l=$('#netChatLog');if(l)l.scrollTop=l.scrollHeight},
 netsend:v=>{const i=$('#netMsg'),t=i?i.value:'';if(!ntext(t,200))return;netRun(()=>netSendChat(v,t).then(()=>{setTimeout(()=>{const l=$('#netChatLog');if(l)l.scrollTop=l.scrollHeight;const j=$('#netMsg');if(j)j.focus()},30);return''}))},
 netquick:v=>{const i=$('#netMsg');if(i)i.value=v;ACT.netsend(NET.chatWith)},
 netblock:v=>{const m=mp();prof();if(m.blk[v]){delete m.blk[v];save();closeModal();toast('Unblocked');return}askConfirm('Block this player? They are removed from your friends and you will no longer get their messages, requests or trade offers.',()=>{m.blk[v]=1;const was=m.fr[v];delete m.chat[v];delete m.chu[v];save();closeModal();if(was)netFriendRemove(v).catch(()=>{});toast('🚫 Blocked');render()})},
 netav:v=>{const p=prof();if(v=='u'&&!p.img){toast('Upload a picture first.');return}p.a=v;save();render();netPublish(true).catch(()=>{});toast('Profile picture updated')},
 netupload:()=>{const f=($('#netUp')||{}).files;netRun(()=>netResizeUpload(f&&f[0]).then(d=>{const p=prof();p.img=d;p.a='u';save();return netPublish(true).then(()=>'📷 Profile picture updated')}))},
 netbio:()=>{const p=prof();p.b=ntext(($('#netBio')||{}).value,150);save();netRun(()=>netPublish(true).then(()=>'Bio saved'))},
 netcol:v=>{const p=prof();p.col=+v|0;save();render();netPublish(true).catch(()=>{})},
 netti:v=>{const t=NTITLES.find(x=>x.id==v);if(!t||!t.ok())return;const p=prof();p.ti=v;save();render();netPublish(true).catch(()=>{});toast('Title set: '+t.t)},
 netsc:v=>{const p=prof(),id=+v,i=p.sc.indexOf(id);if(i>=0)p.sc.splice(i,1);else{if(p.sc.length>=3){toast('Showcase holds 3 cards. Remove one first.');return}p.sc.push(id)}save();const q=($('[data-nf=s]')||{}).value||'',sc=($('[data-nl=s]')||{}).scrollTop||0;render();const e=$('[data-nf=s]');if(e){e.value=q;netFilter(e)}const l=$('[data-nl=s]');if(l)l.scrollTop=sc;netPublish(true).catch(()=>{})},
 netpw:()=>{const v=($('#netNewPw')||{}).value;netRun(()=>netChangePw(v))}
});
document.addEventListener('change',e=>{if(e.target&&e.target.id=='netTeam'){const p=prof();p.tm=+e.target.value;if(!(p.tm>=0&&p.tm<30))p.tm=-1;save();netPublish(true).catch(()=>{});toast('Favorite team saved')}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter'||!e.target)return;const id=e.target.id;if(id=='ivName'){e.preventDefault();ACT.ivclaim()}else if(id=='netMsg'){e.preventDefault();ACT.netsend(NET.chatWith)}else if(id=='netPw'||id=='netName'||id=='netEmail'){e.preventDefault();ACT.netauth(NET.gm=='up'?'up':'in')}else if(id=='netFgEmail'){e.preventDefault();ACT.netforgot()}else if(id=='netAddEm'){e.preventDefault();ACT.netaddem()}else if(id=='netFriend'){e.preventDefault();ACT.netfind()}});
function netFilter(e){const q=e.value.trim().toLowerCase(),box=document.querySelector('[data-nl="'+e.dataset.nf+'"]');if(box)box.querySelectorAll('[data-nk]').forEach(c=>{c.style.display=!q||c.dataset.nk.includes(q)?'':'none'})}
document.addEventListener('input',e=>{if(e.target&&e.target.dataset&&e.target.dataset.nf)netFilter(e.target);if(e.target&&e.target.id=='ivName'){const p=$('#ivPrevN');if(p)p.textContent=e.target.value.trim().toLowerCase()||'your_name'}});
VIEWS.online=onlineView;VIEWS.me=meView;
netLoadLocal();admSync();
if(NET.au&&NET.cfg)netAfterLogin().then(ch=>{if(ch){render();if(NET.msg2){toast(NET.msg2);NET.msg2=''}}else netRefresh()},()=>{});
setInterval(netTick,5000);
if(typeof addEventListener=='function'){addEventListener('visibilitychange',()=>{if(document.hidden){if(netOn()&&NET.dirty&&S.drafted)netBackup().catch(()=>{})}else if(netOn())netPoll()})}

render();if(MIGMSG){save();toast(MIGMSG)}
// Live countdowns (free pack, trade cooldown); re-render when a timer finishes
setInterval(()=>{if(S.drafted){undoBar();trFix();if(trWatch()){save();renderTop();if(['home','roster','training'].includes(tab)&&!$('#ov').className)render()}}document.querySelectorAll('[data-pb]').forEach(e=>{const[en,du]=e.dataset.pb.split('|').map(Number);e.style.width=Math.max(0,Math.min(100,100-(en-Date.now())/du*100))+'%'});document.querySelectorAll('[data-skipall]').forEach(e=>{e.textContent=trSkipAll().toLocaleString()});document.querySelectorAll('[data-skip]').forEach(e=>{e.textContent=trSkip(+e.dataset.skip-Date.now()).toLocaleString()});let done=0;document.querySelectorAll('[data-cd]').forEach(e=>{const r=+e.dataset.cd-Date.now();e.textContent=r>0?fmtT(r):'ready!';if(r<=0)done=1});evTick();if(done&&['goals','trade','home','store','daily','training','events'].includes(tab)&&!$('#ov').className)render()},1000);
</script></body></html>
